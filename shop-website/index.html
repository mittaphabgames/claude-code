<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Love Shop | ร้านของขวัญแห่งความรัก</title>
<style>
  :root { --bg:#fffaf7; --card:#fff; --ink:#3a2a2a; --muted:#8a7474; --accent:#d9546b; --accent-d:#b93f55; --line:#f0e1dc; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:"Sarabun","Noto Sans Thai",system-ui,sans-serif; background:var(--bg); color:var(--ink); }
  header { position:sticky; top:0; z-index:10; display:flex; align-items:center; justify-content:space-between; gap:12px; padding:12px 16px; background:rgba(255,250,247,.95); border-bottom:1px solid var(--line); }
  .logo { font-size:1.3rem; font-weight:700; color:var(--accent); }
  .actions { display:flex; gap:8px; }
  button { font:inherit; cursor:pointer; border-radius:999px; border:1px solid var(--accent); padding:8px 16px; background:#fff; color:var(--accent); }
  button.primary { background:var(--accent); color:#fff; }
  button.primary:hover { background:var(--accent-d); }
  .hero { text-align:center; padding:56px 16px 40px; }
  .hero h1 { margin:0 0 8px; font-size:clamp(1.8rem,5vw,2.8rem); }
  .hero p { margin:0; color:var(--muted); }
  main { max-width:1100px; margin:0 auto; padding:0 16px 64px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:16px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:16px; overflow:hidden; display:flex; flex-direction:column; }
  .thumb { aspect-ratio:1; display:grid; place-items:center; font-size:4rem; background:#fdeceb; }
  .info { padding:14px; display:flex; flex-direction:column; gap:6px; flex:1; }
  .info h3 { margin:0; font-size:1rem; }
  .price { color:var(--accent); font-weight:700; }
  .info button { margin-top:auto; }
  aside { position:fixed; top:0; right:0; height:100%; width:min(380px,100%); background:#fff; border-left:1px solid var(--line); transform:translateX(100%); transition:transform .25s; display:flex; flex-direction:column; z-index:20; }
  aside.open { transform:none; }
  aside h2 { margin:0; padding:16px; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; }
  #items { flex:1; overflow:auto; padding:8px 16px; }
  .row { display:flex; align-items:center; gap:8px; padding:10px 0; border-bottom:1px solid var(--line); }
  .row span.n { flex:1; }
  .row button { padding:2px 10px; }
  .foot { padding:16px; border-top:1px solid var(--line); display:grid; gap:8px; }
  .foot input, .foot textarea { font:inherit; padding:8px 10px; border:1px solid var(--line); border-radius:8px; width:100%; }
  .total { display:flex; justify-content:space-between; font-weight:700; }
  footer { text-align:center; padding:24px; color:var(--muted); border-top:1px solid var(--line); }
  #toast { position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:var(--ink); color:#fff; padding:10px 18px; border-radius:999px; opacity:0; pointer-events:none; transition:opacity .2s; z-index:30; }
  #toast.show { opacity:1; }
</style>
</head>
<body>
<header>
  <div class="logo">💕 Love Shop</div>
  <div class="actions">
    <button id="lang">EN</button>
    <button class="primary" id="cartBtn"></button>
  </div>
</header>

<section class="hero">
  <h1 data-i18n="heroTitle"></h1>
  <p data-i18n="heroSub"></p>
</section>

<main><div class="grid" id="grid"></div></main>

<aside id="cart">
  <h2><span data-i18n="cart"></span><button id="closeCart">✕</button></h2>
  <div id="items"></div>
  <div class="foot">
    <div class="total"><span data-i18n="total"></span><span id="total"></span></div>
    <input id="name" data-ph="name">
    <input id="phone" data-ph="phone">
    <textarea id="addr" rows="2" data-ph="addr"></textarea>
    <button class="primary" id="order" data-i18n="order"></button>
  </div>
</aside>

<footer>© Love Shop · <span data-i18n="contact"></span></footer>
<div id="toast"></div>

<script>
// ===== ตั้งค่าร้าน: แก้ตรงนี้ได้เลย =====
const CONTACT_LINE = ""; // ใส่ LINE ID หรือเบอร์ติดต่อ
const PRODUCTS = [
  { id:1, emoji:"🌹", th:"ช่อกุหลาบสีแดง", en:"Red Rose Bouquet", price:590 },
  { id:2, emoji:"💌", th:"การ์ดความรักทำมือ", en:"Handmade Love Card", price:120 },
  { id:3, emoji:"🧸", th:"ตุ๊กตาหมีกอดรัก", en:"Cuddle Teddy Bear", price:450 },
  { id:4, emoji:"💍", th:"สร้อยคอหัวใจเงินแท้", en:"Sterling Silver Heart Necklace", price:1290 },
  { id:5, emoji:"🍫", th:"ช็อกโกแลตกล่องหัวใจ", en:"Heart Chocolate Box", price:290 },
  { id:6, emoji:"🕯️", th:"เทียนหอมโรแมนติก", en:"Romantic Scented Candle", price:350 },
];
const T = {
  th: { heroTitle:"ของขวัญที่ส่งต่อความรัก", heroSub:"เลือกของขวัญพิเศษให้คนที่คุณรัก", add:"ใส่ตะกร้า", cart:"ตะกร้าสินค้า", total:"รวม", order:"ยืนยันสั่งซื้อ", empty:"ตะกร้าว่าง", name:"ชื่อ-นามสกุล", phone:"เบอร์โทร", addr:"ที่อยู่จัดส่ง", added:"เพิ่มลงตะกร้าแล้ว", fill:"กรุณากรอกข้อมูลให้ครบ", copied:"คัดลอกคำสั่งซื้อแล้ว ส่งให้ร้านทางแชทได้เลย", contact:"ติดต่อสั่งซื้อทางแชท", cur:"฿" },
  en: { heroTitle:"Gifts that carry your love", heroSub:"Pick something special for someone you adore", add:"Add to cart", cart:"Your cart", total:"Total", order:"Place order", empty:"Your cart is empty", name:"Full name", phone:"Phone", addr:"Shipping address", added:"Added to cart", fill:"Please fill in all fields", copied:"Order copied — send it to the shop via chat", contact:"Order via chat", cur:"฿" },
};
let lang = "th";
let cart = {};
try { cart = JSON.parse(localStorage.getItem("cart") || "{}"); } catch {}

const $ = (s) => document.querySelector(s);
const t = (k) => T[lang][k];
const fmt = (n) => t("cur") + n.toLocaleString();
const save = () => { try { localStorage.setItem("cart", JSON.stringify(cart)); } catch {} };
const toast = (m) => { const e = $("#toast"); e.textContent = m; e.classList.add("show"); setTimeout(() => e.classList.remove("show"), 1800); };

function render() {
  document.documentElement.lang = lang;
  $("#lang").textContent = lang === "th" ? "EN" : "TH";
  document.querySelectorAll("[data-i18n]").forEach((e) => (e.textContent = t(e.dataset.i18n)));
  document.querySelectorAll("[data-ph]").forEach((e) => (e.placeholder = t(e.dataset.ph)));
  $("#grid").innerHTML = PRODUCTS.map((p) => `
    <div class="card"><div class="thumb">${p.emoji}</div>
      <div class="info"><h3>${p[lang]}</h3><div class="price">${fmt(p.price)}</div>
      <button class="primary" onclick="add(${p.id})">${t("add")}</button></div></div>`).join("");
  const ids = Object.keys(cart);
  const count = ids.reduce((s, i) => s + cart[i], 0);
  const sum = ids.reduce((s, i) => s + cart[i] * PRODUCTS.find((p) => p.id == i).price, 0);
  $("#cartBtn").textContent = `🛒 ${count}`;
  $("#total").textContent = fmt(sum);
  $("#items").innerHTML = ids.length ? ids.map((i) => {
    const p = PRODUCTS.find((x) => x.id == i);
    return `<div class="row"><span>${p.emoji}</span><span class="n">${p[lang]}<br><small>${fmt(p.price)}</small></span>
      <button onclick="chg(${i},-1)">−</button><b>${cart[i]}</b><button onclick="chg(${i},1)">+</button></div>`;
  }).join("") : `<p style="color:var(--muted)">${t("empty")}</p>`;
}
function add(id) { cart[id] = (cart[id] || 0) + 1; save(); render(); toast(t("added")); }
function chg(id, d) { cart[id] += d; if (cart[id] <= 0) delete cart[id]; save(); render(); }

$("#lang").onclick = () => { lang = lang === "th" ? "en" : "th"; render(); };
$("#cartBtn").onclick = () => $("#cart").classList.add("open");
$("#closeCart").onclick = () => $("#cart").classList.remove("open");
$("#order").onclick = async () => {
  const name = $("#name").value.trim(), phone = $("#phone").value.trim(), addr = $("#addr").value.trim();
  if (!Object.keys(cart).length || !name || !phone || !addr) return toast(t("fill"));
  const lines = Object.keys(cart).map((i) => { const p = PRODUCTS.find((x) => x.id == i); return `- ${p[lang]} x${cart[i]} = ${fmt(p.price * cart[i])}`; });
  const msg = `${lines.join("\n")}\n${t("total")}: ${$("#total").textContent}\n${name} / ${phone}\n${addr}`;
  try { await navigator.clipboard.writeText(msg); } catch {}
  toast(t("copied"));
  if (CONTACT_LINE) window.open("https://line.me/R/oaMessage/" + encodeURIComponent(CONTACT_LINE) + "/?" + encodeURIComponent(msg));
};
render();
</script>
</body>
</html>
